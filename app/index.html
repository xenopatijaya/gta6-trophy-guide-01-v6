<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Atlas — GTA VI Trophy Guide &amp; Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <h1>Leonida Atlas <span class="version-tag">v6</span></h1>
        <p class="tagline">GTA VI · PS5 trophy guide &amp; tracker · every guide step cited</p>
      </div>
    </div>
    <div class="masthead-progress" id="masthead-progress"></div>
  </div>
  <div class="audit-strip" id="audit-strip"></div>
</header>

<nav class="view-tabs" id="view-tabs">
  <button data-view="ledger" class="tab is-active">Ledger / Checklist</button>
  <button data-view="roadmap" class="tab">Roadmap</button>
  <button data-view="missables" class="tab">Missables &amp; watch</button>
  <button data-view="planner" class="tab">Next up / Planner</button>
  <button data-view="matrix" class="tab">Source matrix</button>
  <button data-view="sources" class="tab">Sources &amp; disputes</button>
</nav>

<main id="app" class="app-shell"></main>

<footer class="colophon">
  <p>Progress is stored only in this browser (localStorage) and travels with the export file — nothing is uploaded anywhere.</p>
</footer>

<input type="file" id="import-file" accept="application/json" hidden>
<script src="js/store.js"></script>
<script src="js/planner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
